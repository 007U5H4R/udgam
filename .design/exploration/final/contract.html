<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Udgam M-002 · Agreements, settlement, processing</title>
<meta name="description" content="Design prototype, M-002 addendum (Design.md §28): buyer agreements, funding and grading; the FPO admin's settlement panel; the processor's processing step and hand-on; the extra certificate journey step. Same tokens and components as admin.html.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0E0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens · Direction D (Opal-inspired) — same as index.html / verify.html ── */
:root{
  --bg:#0A0E0C;
  --glow:radial-gradient(120% 60% at 50% -10%, rgba(64,150,110,.55), rgba(20,60,45,.25) 45%, transparent 70%);
  --surface:rgba(255,255,255,.06);
  --surface-2:rgba(255,255,255,.10);
  --surface-solid:#191D1B;
  --hairline:rgba(255,255,255,.12);
  --ink:#F3F6F4;
  --ink-2:rgba(243,246,244,.74);
  --ink-3:rgba(243,246,244,.58);     /* only ≥ 15 px */
  --grad-text:linear-gradient(90deg,#B9F5D2 0%,#7FE3C1 45%,#D8F58C 100%);
  --ok:#7FE3A6; --ok-ink:#9CF0BF; --ok-tint:rgba(127,227,166,.14);
  --check:#F2B84B; --check-ink:#FFCB6B; --check-tint:rgba(242,184,75,.15);
  --bad:#EF6A5B; --bad-ink:#FF8C7E; --bad-tint:rgba(239,106,91,.15);
  --cherry:#C8322B;
  --pill-bg:rgba(255,255,255,.08);
  --pill-line:rgba(255,255,255,.14);
  --pill-glow:radial-gradient(70% 120% at 50% 130%, rgba(127,227,166,.65), rgba(170,150,255,.35) 45%, transparent 72%);
  --pill-glow-amber:radial-gradient(70% 120% at 50% 130%, rgba(242,184,75,.62), rgba(239,106,91,.30) 45%, transparent 72%);
  --pill-glow-red:radial-gradient(70% 120% at 50% 130%, rgba(239,106,91,.65), rgba(200,50,43,.30) 45%, transparent 72%);
  --focus:#D8F58C;
  --r-card:28px; --r-row:22px;
  --banner-h:52px;
  --rail-w:104px;
  --fs-body:17px;
  --fs-small:15px;
  --pad:20px;
  --font:"Figtree","Noto Sans Kannada",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (max-width:420px){ :root{ --banner-h:60px; --pad:16px; } }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg);scroll-padding-top:calc(var(--banner-h) + 16px)}
body{margin:0;background:var(--glow) no-repeat 50% 0/100% 900px,var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-body);line-height:1.5;padding-top:var(--banner-h);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,p,ul,ol,figure,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,textarea{font:inherit;color:inherit}
a{color:#B9F5D2;text-underline-offset:3px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lit{background:var(--grad-text);-webkit-background-clip:text;background-clip:text;color:transparent}
@supports not ((background-clip:text) or (-webkit-background-clip:text)){ .lit{background:none;color:#B9F5D2} }
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;box-shadow:0 0 0 7px rgba(216,245,140,.22)}
.glass{background:var(--surface);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);border:1px solid var(--hairline)}
.card{border-radius:var(--r-card)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass{background:var(--surface-solid)} .dlg-panel{background:#1B201D!important} }
.eyebrow{font-size:var(--fs-small);font-weight:600;color:var(--ink-2);letter-spacing:.01em}

/* ── Prototype banner ─────────────────────────────────── */
.proto-banner{position:fixed;inset:0 0 auto 0;height:var(--banner-h);z-index:50;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;background:#050706;border-bottom:1px solid rgba(255,255,255,.14);font-size:13px;line-height:1.3;letter-spacing:.02em;color:var(--ink)}
.proto-banner p{flex:1;min-width:0}
.proto-banner b{font-weight:700;color:var(--check-ink)}
.bn-btn{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border:1px solid var(--hairline);border-radius:999px;background:rgba(255,255,255,.06);font-size:15px;font-weight:600;cursor:pointer}
.bn-btn .ic{width:20px;height:20px}

/* ── Buttons (same recipe as the app) ─────────────────── */
.pill{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:0 22px;border-radius:999px;border:1px solid var(--pill-line);background:var(--pill-glow),var(--pill-bg);color:#fff;font-size:17px;font-weight:600;line-height:1.2;text-align:center;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.10);transition:transform .12s ease}
.pill:hover{background:var(--pill-glow),rgba(255,255,255,.11)}
.pill:active{transform:scale(.985)}
.pill:disabled{cursor:not-allowed;background:var(--pill-bg);color:var(--ink-2);box-shadow:none}
.pill.amber{background:var(--pill-glow-amber),var(--pill-bg)}
.pill.red{background:var(--pill-glow-red),var(--pill-bg)}
.pill.red:disabled{background:var(--pill-bg)}
.pill.ghost{background:rgba(255,255,255,.05);box-shadow:none}
.pill.ghost:hover{background:rgba(255,255,255,.09)}
.textbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border:0;background:none;color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;border-radius:999px}
.textbtn:hover{background:rgba(255,255,255,.06)}
.textbtn:disabled{cursor:progress;color:var(--ink-2)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px 0 10px;border-radius:999px;border:1px solid var(--hairline);background:rgba(255,255,255,.06);font-size:17px;font-weight:600;cursor:pointer}
.back:hover{background:rgba(255,255,255,.1)}

/* ── Verdict chips + marks (word + mark + colour) ─────── */
.mk{width:22px;height:22px;flex:none}
.vchip{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 12px 4px 7px;border-radius:999px;font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap}
.vchip.ok{background:var(--ok-tint);color:var(--ok-ink)}
.vchip.check{background:var(--check-tint);color:var(--check-ink)}
.vchip.bad{background:var(--bad-tint);color:var(--bad-ink)}

/* ── Shell ────────────────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:calc(100vh - var(--banner-h))}
.rail{position:sticky;top:var(--banner-h);height:calc(100vh - var(--banner-h));display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 10px 18px;border-right:1px solid var(--hairline);background:rgba(5,7,6,.38)}
.rail-mark{display:flex;flex-direction:column;align-items:center;gap:0;font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.rail-mark img{width:52px;height:52px;margin:-6px 0 -4px}
.rail ul{display:grid;gap:6px;width:100%}
.rail-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:68px;padding:8px 4px;border-radius:20px;color:var(--ink-2);font-size:14px;font-weight:600;text-decoration:none;line-height:1.2}
.rail-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.rail-item[aria-current="page"]{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
.ri-ic{position:relative;display:grid;place-items:center}
.count{position:absolute;top:-8px;left:calc(100% - 6px);min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--check);color:#0A0E0C;font-size:13px;font-weight:800;line-height:22px;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px #0A0E0C}
.rail-me{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px;font-weight:600;line-height:1.25}
.rail-me small{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:rgba(185,245,210,.14);border:1px solid rgba(185,245,210,.35);color:#B9F5D2;font-size:15px;font-weight:800}

.main{display:grid;grid-template-columns:400px minmax(0,1fr);min-width:0}

/* ── Queue column ─────────────────────────────────────── */
.queue{min-width:0;padding:22px 18px 28px 22px;border-right:1px solid var(--hairline)}
.q-brand{display:none}
.q-head h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.q-sub{margin-top:6px;color:var(--ink-2);font-size:var(--fs-small)}
.q-list{display:grid;gap:10px;margin-top:18px}
.q-item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:3px 14px;align-items:start;width:100%;min-height:96px;padding:14px 16px 14px 14px;border-radius:var(--r-row);border:1px solid var(--hairline);background:var(--surface);text-align:left;cursor:pointer;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.q-item:hover{background:rgba(255,255,255,.09)}
.q-item[aria-current="true"]{background:rgba(127,227,193,.10);border-color:rgba(185,245,210,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 24px rgba(127,227,193,.12)}
.q-bub{grid-row:1/4;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--check-tint);color:var(--check-ink)}
.q-bub.bad{background:var(--bad-tint);color:var(--bad-ink)}
.q-id{font-size:17px;font-weight:700;line-height:1.3}
.q-kg{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3;white-space:nowrap}
.q-when{grid-column:2/4;font-size:var(--fs-small);color:var(--ink-2);font-variant-numeric:tabular-nums}
.q-why{grid-column:2/4;display:flex;align-items:center;gap:7px;margin-top:4px;font-size:var(--fs-small);font-weight:600;line-height:1.3;color:var(--check-ink)}
.q-why.bad{color:var(--bad-ink)}
.q-why .mk{width:18px;height:18px}
.q-sec{margin-top:28px;font-size:17px;font-weight:700}
.q-sec span{color:var(--ink-2);font-weight:500}
.q-sec-note{margin-top:2px;font-size:var(--fs-small);color:var(--ink-2)}
.q-sec + .q-sec-note + .q-list{margin-top:12px}
.q-done{margin-top:18px;padding:22px 20px;text-align:center}
.q-done p + p{margin-top:4px;color:var(--ink-2);font-size:var(--fs-small)}

/* skeletons (loading) */
.sk{display:block;border-radius:10px;background:linear-gradient(90deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.06) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.sk-row{display:grid;grid-template-columns:44px 1fr;gap:10px 14px;min-height:96px;padding:14px;border-radius:var(--r-row)}
.sk-row .sk:first-child{width:44px;height:44px;border-radius:50%;grid-row:1/4}
.sk-line{height:14px}
.load-note{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--ink);font-weight:600}
.load-note .ic{color:#B9F5D2;animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* state panels (empty, error) */
.state-card{max-width:560px;margin:28px auto 0;padding:28px 26px 26px;text-align:center}
.state-card h2{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.state-card p{margin-top:6px}
.state-card .pill{margin:20px auto 0;max-width:320px}
.state-card.err{background:linear-gradient(180deg,rgba(242,184,75,.22),rgba(242,184,75,.06) 55%),rgba(24,22,18,.72);border-color:rgba(255,214,150,.22)}
.st-ic{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 14px;border-radius:50%;border:1.5px solid rgba(255,203,107,.55);background:rgba(242,184,75,.12);color:var(--check-ink);box-shadow:0 0 30px rgba(242,184,75,.25)}
.st-ic .ic{width:32px;height:32px}
.cherry{position:relative;display:grid;place-items:center;margin:0 auto 10px;width:112px;height:112px}
.cherry img{position:relative;width:100%;height:100%;z-index:1;filter:drop-shadow(0 0 2px rgba(127,227,166,.85)) drop-shadow(0 0 20px rgba(127,227,166,.45))}
.cherry::before{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(closest-side,rgba(127,227,166,.34),rgba(127,227,166,.10) 55%,transparent)}

/* ── Detail column ────────────────────────────────────── */
.detail{min-width:0;display:flex;flex-direction:column;container-type:inline-size}
.d-body{flex:1;width:100%;max-width:980px;padding:24px 32px 28px}
.d-back{display:none;margin-bottom:12px}
.d-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:4px}
.d-title h2{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.d-meta{margin-top:6px;color:var(--ink-2);font-size:var(--fs-small)}

.score-card{margin-top:18px;padding:20px 22px 20px}
.score-line{font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.scale{position:relative;display:grid;grid-template-columns:50fr 30fr 20fr;gap:3px;height:10px;margin:16px 0 8px}
.scale .z{border-radius:999px}
.z-bad{background:rgba(239,106,91,.45)}
.z-check{background:rgba(242,184,75,.55)}
.z-ok{background:rgba(127,227,166,.5)}
.pin{position:absolute;top:-7px;width:4px;height:24px;margin-left:-2px;border-radius:4px;background:#fff;box-shadow:0 0 0 3px #0A0E0C,0 0 14px rgba(255,255,255,.6)}
.scale-key{display:grid;grid-template-columns:50fr 30fr 20fr;gap:3px;font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.3}
.scale-key span:last-child{text-align:right}
.why{margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline)}
.why b{font-weight:700}

.d-grid{display:grid;gap:16px;margin-top:16px;align-items:start}
@container (min-width:720px){ .d-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)} }
.sec-h{font-size:19px;font-weight:700;letter-spacing:-.01em}
.plot-card{padding:16px 16px 16px}
.plot-card .where{display:flex;align-items:center;gap:6px;font-size:var(--fs-small);font-weight:600;color:var(--ink-2)}
.plot-card .where .ic{width:20px;height:20px;color:#B9F5D2}
.plot-map{margin:6px 0 2px;overflow:hidden;border-radius:16px}
.plot-map svg{display:block;width:100%;height:auto;overflow:hidden}
@container (max-width:719.98px){ .plot-map svg{max-height:260px} }
.m-contour{fill:none;stroke:rgba(185,245,210,.10);stroke-width:1.2}
.m-contour-in{fill:none;stroke:rgba(185,245,210,.20);stroke-width:1.2}
.m-fill{fill:url(#plotFill)}
.m-band{fill:none;stroke:rgba(185,245,210,.13);stroke-linejoin:round}
.m-glow{fill:none;stroke:#7FE3C1;stroke-width:9;stroke-linejoin:round;opacity:.55;filter:url(#softGlow)}
.m-line{fill:none;stroke:#B9F5D2;stroke-width:2.6;stroke-linejoin:round}
.m-dot{fill:#fff;stroke:#7FE3C1;stroke-width:4}
.m-dot.out{stroke:#EF6A5B}
.m-ring{fill:rgba(127,227,193,.16);stroke:rgba(185,245,210,.7);stroke-width:1.5}
.m-ring.out{fill:rgba(239,106,91,.18);stroke:rgba(255,140,126,.85)}
.m-gap{stroke:#FF8C7E;stroke-width:2;stroke-dasharray:4 4}
.m-tag{fill:#F3F6F4;font:700 15px var(--font)}
.m-tag-bg{fill:rgba(5,7,6,.72)}
.plot-say{margin-top:4px;font-size:19px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:8px}
.plot-say .mk{width:20px;height:20px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13px;font-weight:600;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #7FE3C1}
.lg-dot.out{border-color:#EF6A5B}
.lg-line{width:18px;height:3px;border-radius:3px;background:#B9F5D2;box-shadow:0 0 6px #7FE3C1}
.lg-band{width:18px;height:10px;border-radius:3px;background:rgba(185,245,210,.22)}

.photos{padding:16px}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.ph{display:flex;flex-direction:column;gap:6px}
.ph .thumb{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#16392A,#0B1F16);display:grid;place-items:center;border:1px solid var(--hairline)}
.ph .thumb svg{display:block;width:100%;height:100%}
.ph .thumb svg.line-art{width:84%;height:84%}
.ph.bad .thumb{box-shadow:0 0 0 2px var(--bad)}
.tag{position:absolute;left:6px;bottom:6px;right:6px;width:max-content;max-width:calc(100% - 12px);font-size:13px;font-weight:600;line-height:1.2;padding:2px 7px;border-radius:999px;background:rgba(5,7,6,.9);color:var(--ink)}
.ph-cap{font-size:13px;font-weight:600;line-height:1.3;color:var(--ink)}
.ph-cap span{display:block;font-weight:500;color:var(--ink-2)}
.ph-flag{display:flex;align-items:flex-start;gap:5px;font-size:13px;font-weight:700;line-height:1.3;color:var(--bad-ink)}
.ph-flag .mk{width:16px;height:16px;margin-top:1px}

.checks-card{margin-top:16px;padding:18px 20px 8px}
.checks-sum{margin-top:2px;color:var(--ink-2);font-size:var(--fs-small)}
.checks{margin-top:10px}
.chk{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 0;border-top:1px solid var(--hairline)}
.chk.bad,.chk.check,.chk.na{margin:0 -10px;padding:12px 10px;border-radius:16px;border-top-color:transparent}
.chk.bad{background:rgba(239,106,91,.10)}
.chk.check{background:rgba(242,184,75,.08)}
.chk.na{background:rgba(255,255,255,.05)}
.chk.bad + .chk,.chk.check + .chk,.chk.na + .chk{border-top-color:transparent}
.c-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px 12px}
.c-name{order:-1;font-weight:700;min-width:0}
.c-name code{display:block;margin-top:1px;overflow-wrap:anywhere;font:500 13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2)}
.c-stat{display:inline-flex;align-items:center;gap:7px;font-size:var(--fs-small);font-weight:700;white-space:nowrap;line-height:1.5}
.c-stat .mk{width:20px;height:20px}
.c-stat.ok{color:var(--ok-ink)} .c-stat.check{color:var(--check-ink)} .c-stat.bad{color:var(--bad-ink)} .c-stat.na{color:var(--ink)}
.c-ev{color:var(--ink);font-size:var(--fs-small);line-height:1.45}
.c-ev .again{display:block;margin-top:4px;font-weight:700;color:var(--check-ink)}
@container (min-width:720px){
  .chk{grid-template-columns:152px minmax(0,220px) minmax(0,1fr);gap:4px 16px;align-items:start}
  .c-top{display:contents}
  .c-stat{grid-column:1;grid-row:1}
  .c-name{grid-column:2;grid-row:1}
  .c-ev{grid-column:3;grid-row:1;padding-top:1px}
}

/* actions */
.d-actions{position:sticky;bottom:0;z-index:5;width:100%;max-width:980px;padding:18px 32px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 74%,rgba(10,14,12,0))}
.act-row{display:grid;grid-template-columns:1.3fr 1fr auto;gap:10px;align-items:center}
.again-hint{margin-top:6px;font-size:var(--fs-small);color:var(--ink-2);text-align:right}

.locked .ic{color:var(--bad-ink);margin-top:1px}
.outcome{display:grid;gap:8px;padding:18px 20px 20px;border-radius:var(--r-card)}

/* ── States ───────────────────────────────────────────── */
body:not([data-state="working"]) [data-show~="working"],
body:not([data-state="loading"]) [data-show~="loading"],
body:not([data-state="empty"]) [data-show~="empty"],
body:not([data-state="error"]) [data-show~="error"]{display:none!important}
body[data-state="empty"] .main,body[data-state="error"] .main{grid-template-columns:minmax(0,1fr)}
body[data-state="empty"] .detail,body[data-state="error"] .detail{display:none}

/* ── Desktop ≥ 1100: rail · list · detail, columns scroll on their own ── */
@media (min-width:1100px){
  .shell{height:calc(100vh - var(--banner-h))}
  .main{height:calc(100vh - var(--banner-h))}
  .queue,.detail{height:100%;overflow-y:auto;overscroll-behavior:contain}
  .queue{scrollbar-width:thin}
}

/* ── Tablet / narrow < 1100: list → detail (detail is a full panel with Back) ── */
@media (max-width:1099.98px){

  .d-back{display:inline-flex}
  .d-body{max-width:none;padding:18px var(--pad) 20px}

  .rail-mark,.rail-me{display:none}

  .count{top:-6px;left:calc(100% - 8px)}
  body.detail-open .rail{display:none}
  .queue{padding-bottom:110px}
  .q-brand{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:800;letter-spacing:-.03em;margin:-6px 0 10px}
  .q-brand img{width:36px;height:36px;margin:-6px -2px -6px -8px}
  .q-head h1{font-size:28px}
  .d-title h2{font-size:26px}
  .score-line{font-size:20px}
  .score-card,.plot-card,.photos{padding:16px}
  .checks-card{padding:16px 16px 6px}
  .scale-key{font-size:13px}
  .d-actions{padding-top:12px}
  .act-row{grid-template-columns:1fr 1fr;gap:8px}
  .act-row .pill:first-child{grid-column:1/-1}
  .act-row .pill,.act-row .textbtn{min-height:52px;font-size:16px;padding:0 12px;gap:6px;white-space:nowrap}
  .act-row .textbtn{border:1px solid var(--hairline);background:rgba(255,255,255,.04)}
  .again-hint{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .dec-btns{grid-template-columns:1fr}
  .state-card{margin-top:20px;padding:24px 18px 22px}
}
@media (max-width:380px){
  .scale-key{grid-template-columns:1fr 1fr 1fr}

  .scale-key span:nth-child(2){text-align:center!important}
  .scale-key span:last-child{text-align:right!important}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media (forced-colors:active){ .lit{color:CanvasText;background:none} .pin{background:CanvasText} }

<style>
/* ══ M-002 addendum composition (Design.md §28) ════════════════════════════════

   value that already exists in admin.html (above, verbatim) or verify.html (journey,
   .unconfirmed — copied verbatim and scoped to .cert). No new tokens, no new motion. */
a.q-item{color:inherit;text-decoration:none}
.q-bub.ok{background:var(--ok-tint);color:var(--ok-ink)}

.q-why.na{color:var(--ink-2)}

/* rail with fewer items (buyer: 2, processor: 1) — same component, fewer columns */
@media (max-width:699.98px){

.terms dl > div{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:12px 0;border-top:1px solid var(--hairline)}
.terms dt{font-size:var(--fs-small);font-weight:600;color:var(--ink-2)}
.terms dd{font-weight:700;font-variant-numeric:tabular-nums}
@container (min-width:720px){
  .terms dl{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}

}

/* settlement conditions: the admin check rows (.chk) with Met / Not met */
.cond-val b{font-weight:700;font-variant-numeric:tabular-nums}
.trust{display:flex;align-items:flex-start;gap:8px;margin:4px 0 12px;font-size:var(--fs-small);color:var(--ink-2)}

.outcome.ok-o{border:1px solid rgba(185,245,210,.30);background:linear-gradient(180deg,rgba(127,227,166,.16),rgba(127,227,166,.04) 60%),rgba(20,28,24,.9)}
.outcome.check-o{border:1px solid rgba(255,214,150,.22);background:linear-gradient(180deg,rgba(242,184,75,.22),rgba(242,184,75,.06) 55%),rgba(24,22,18,.72)}

/* forms: the .decide textarea recipe applied to inputs and selects */
.form-card{padding:18px 20px 20px;display:grid;gap:16px}

.field label,.field legend{font-weight:700;padding:0}

.field input[type="text"],.field input[type="date"],.field select{display:block;width:100%;min-height:56px;padding:12px 14px;border-radius:16px;border:1.5px solid rgba(255,255,255,.28);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;font-size:17px;line-height:1.45;color-scheme:dark;font-variant-numeric:tabular-nums}
.field input:focus-visible,.field select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

@container (min-width:720px){ .f-row{grid-template-columns:repeat(2,minmax(0,1fr))} }
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 18px;border-radius:18px;border:1px solid var(--hairline);background:rgba(255,255,255,.05);color:var(--ink);font-size:17px;font-weight:600;cursor:pointer}

.cert{--accent:#B9F5D2;--accent-glow:rgba(127,227,193,.75);--accent-soft:rgba(127,227,193,.14);max-width:820px;margin:0 auto;padding:16px var(--pad) 48px}

.t-step{font-weight:700;font-size:19px;line-height:1.3}
.t-when{font-variant-numeric:tabular-nums}

.tl-sk li{display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:22px}

    <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M8.6 16.1a5 5 0 0 1 6-.5"/><path d="M5.3 12.7a9.6 9.6 0 0 1 4.2-2.2"/><path d="M14 10.5a9.6 9.6 0 0 1 4.8 2.3"/><path d="M2 9.3a14.4 14.4 0 0 1 3.3-2.2"/><path d="M9.7 5.2A14.4 14.4 0 0 1 22 9.3"/><path d="M12 19.6h.01"/></symbol>

    <!-- verdict marks: circle / diamond / square / dashed circle — the word is always beside -->
    <symbol id="mk-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#7FE3A6"/><path d="M7 12.4l3.3 3.3L17 9" fill="none" stroke="#0A0E0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="mk-check" viewBox="0 0 24 24"><path d="M12 1.2 22.8 12 12 22.8 1.2 12z" fill="#F2B84B" stroke="#F2B84B" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7v6" stroke="#0A0E0C" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.4" fill="#0A0E0C"/></symbol>
    <symbol id="mk-bad" viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="#EF6A5B"/><path d="M8 8l8 8M16 8l-8 8" stroke="#0A0E0C" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="mk-na" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#F3F6F4" stroke-width="1.8" stroke-dasharray="3 2.6"/><path d="M8 12h8" stroke="#F3F6F4" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  </defs>
</svg>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="main" id="main">
    <section class="queue" id="queue" aria-labelledby="q-h"></section>
    <section class="detail" id="detail" aria-labelledby="d-h" tabindex="0"></section>
  </main>
</div>

<main class="cert" id="cert" aria-labelledby="c-h"></main>

<p class="vh" aria-live="polite" id="live"></p>

<!-- Reviewer: screens and states -->
<dialog class="top" id="states-dialog" aria-labelledby="states-h">
  <div class="dlg-panel">
    <h2 id="states-h">Prototype screens</h2>
    <nav class="menu-list" aria-label="Screens" id="screen-menu"></nav>
    <h3 id="st-h">State</h3>
    <nav class="menu-list state-pills" aria-labelledby="st-h" id="state-menu"></nav>
    <nav class="menu-list" aria-label="Other prototypes">
      <a href="admin.html">Admin review (admin.html)</a>
      <a href="verify.html">Public certificate (verify.html)</a>
    </nav>
    <button class="textbtn" type="button" data-close>Close</button>
  </div>
</dialog>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const mk = (id, cls = 'mk') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const icon = (id, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const chip = (k, word) => `<span class="vchip ${k}">${mk({ ok: 'mk-ok', check: 'mk-check', na: 'mk-na' }[k])}${word}</span>`;
  const spin = icon('i-ring', 'ic spin');
  const wideMQ = matchMedia('(min-width: 1100px)');

  /* ── Grade scale (Design.md §28.4): label → number 0–100; the contract stores uint8 ── */
  const GRADES = [['Excellent', 90], ['Very good', 80], ['Good', 70], ['Fair', 60], ['Low', 40]];
  const g = n => { const x = GRADES.find(([, v]) => v === n); return `${x[0]} · ${n}`; };

  /* ── Demo data: pseudonymous orgs, mock INR (2 decimals = paise) ── */
  const AG = {
    'AG-0007': { fpo: 'Hosahalli FPO', crop: 'Arabica cherry', kg: '600.0', min: 70, amt: '₹1,50,000.00', by: '31 Dec 2026', made: '2 Sep 2026', batch: 'KDG-2026-0142', dkg: '612.0', dwhen: '29 Sep 2026', picks: 14 },
    'AG-0008': { fpo: 'Hosahalli FPO', crop: 'Arabica cherry', kg: '600.0', min: 70, amt: '₹1,50,000.00', by: '31 Dec 2026', made: '4 Sep 2026', batch: 'KDG-2026-0151', dkg: '598.5', dwhen: '30 Sep 2026', picks: 14 },
    'AG-0009': { fpo: 'Hosahalli FPO', crop: 'Robusta cherry', kg: '1,200.0', min: 60, amt: '₹2,40,000.00', by: '15 Feb 2027', made: '1 Oct 2026' },
    'AG-0005': { fpo: 'Hosahalli FPO', crop: 'Arabica cherry', kg: '400.0', min: 70, amt: '₹1,00,000.00', by: '30 Sep 2026', made: '1 Aug 2026' },
    'AG-0004': { fpo: 'Hosahalli FPO', crop: 'Arabica cherry', kg: '500.0', min: 60, amt: '₹1,25,000.00', by: '30 Nov 2026', made: '28 Jul 2026' },
  };

  /* ── Shells: the admin rail component with each role's items ── */
  const RAILS = {
    buyer: { n: 2, me: ['MS', 'Meera S.', 'Buyer B-07'], items: [['Batches', 'i-box'], ['Agreements', 'i-seal', true]] },
    admin: { n: 4, me: ['AK', 'Asha K.', 'FPO admin'], items: [['Review', 'i-inbox', false, 4], ['Plots', 'i-plot'], ['Batches', 'i-box', true], ['Phones', 'i-phone']] },
    processor: { n: 1, me: ['RP', 'Ravi P.', 'Curing works C-03'], items: [['Batches', 'i-box', true]] },
  };
  function railHTML(kind) {
    const r = RAILS[kind];
    return `<span class="rail-mark"><img src="cherry.svg" alt="" width="52" height="52">Udgam</span>
      <ul data-n="${r.n}">${r.items.map(([w, ic, cur, cnt]) => `<li><a class="rail-item" href="#" data-nav="${w}"${cur ? ' aria-current="page"' : ''}><span class="ri-ic">${icon(ic)}${cnt ? `<span class="count" aria-hidden="true">${cnt}</span>` : ''}</span>${w}${cnt ? `<span class="vh">, ${cnt} waiting</span>` : ''}</a></li>`).join('')}</ul>
      <p class="rail-me"><span class="avatar" aria-hidden="true">${r.me[0]}</span><span>${r.me[1]}<small>${r.me[2]}</small></span></p>`;
  }

  /* ── Shared pieces ── */
  const brand = `<span class="q-brand"><img src="cherry.svg" alt="" width="36" height="36">Udgam</span>`;
  const head = (eyebrow, h1, sub, count) => `${brand}<header class="q-head"><p class="eyebrow">${eyebrow}</p>
    <h1 id="q-h" tabindex="-1">${count != null ? `<span class="lit">${count}</span> ` : ''}${h1}</h1>${sub ? `<p class="q-sub">${sub}</p>` : ''}</header>`;
  const listLoading = label => `<p class="load-note">${icon('i-ring')}${label}</p><ul class="q-list" aria-hidden="true">${[62, 58, 64].map(w => `<li class="glass sk-row"><span class="sk"></span><span class="sk sk-line" style="width:${w}%"></span><span class="sk sk-line" style="width:${w - 18}%"></span><span class="sk sk-line" style="width:${w + 10}%"></span></li>`).join('')}</ul>`;
  const detailLoading = `<div class="d-body" aria-hidden="true"><div class="d-sk"><span class="sk m"></span><span class="sk h"></span><span class="sk box"></span><span class="sk box2"></span></div></div>`;
  const emptyCard = (h, p, extra = '') => `<div class="glass card state-card"><div class="cherry" aria-hidden="true"><img src="cherry.svg" alt="" width="112" height="112"></div><h2>${h}</h2><p>${p}</p>${extra}</div>`;
  const errorCard = (h, p) => `<div class="glass card state-card err" role="alert"><div class="st-ic" aria-hidden="true">${icon('i-wifi-off')}</div><h2>${h}</h2><p>${p}</p><button class="pill amber" type="button" data-retry>${icon('i-retry')}Try again</button></div>`;
  const inlineErr = (b, p) => `<div class="inline-err" role="alert">${icon('i-wifi-off')}<p><b>${b}</b>${p}</p></div>`;
  const back = label => `<button class="back d-back" type="button" data-back>${icon('i-arrow-left')}${label}</button>`;
  const row = (href, bub, bubCls, id, kg, when, whyCls, whyMk, why, cur) => `<li><a class="q-item" href="${href}" aria-current="${!!cur}">
      <span class="q-bub ${bubCls}">${icon(bub)}</span><span class="q-id">${id}</span><span class="q-kg">${kg}</span>
      <span class="q-when">${when}</span><span class="q-why ${whyCls}">${mk(whyMk)}<span>${why}</span></span></a></li>`;
  const terms = a => `<section class="glass card terms" aria-labelledby="t-h"><h3 class="sec-h" id="t-h">Terms</h3><dl>
      <div><dt>Crop</dt><dd>${a.crop}</dd></div>
      <div><dt>Agreed quantity</dt><dd>${a.kg} kg</dd></div>
      <div><dt>Minimum grade</dt><dd>${g(a.min)} of 100</dd></div>
      <div><dt>Amount</dt><dd>${a.amt}<span class="mock">mock INR · not real money</span></dd></div>
      <div><dt>Deadline</dt><dd>${a.by}</dd></div>
      <div><dt>With</dt><dd>${a.fpo}</dd></div></dl></section>`;
  const dHead = (eyebrow, h, chipHTML, meta) => `<header><p class="eyebrow">${eyebrow}</p><div class="d-title"><h2 id="d-h" tabindex="-1">${h}</h2>${chipHTML}</div><p class="d-meta">${meta}</p></header>`;

  /* ── Settlement panel: three conditions, each value vs threshold ── */
  function conditions(v) {
    const rows = [
      ['Delivered quantity', 'quantity', v.q],
      ['Quality grade', 'grade', v.gr],
      ['Pickings Verified', 'all_verified', v.ver],
    ];
    const met = rows.filter(r => r[2][0]).length;
    return `<section class="glass card checks-card" aria-labelledby="set-h">
      <h3 class="sec-h" id="set-h">Settlement conditions</h3>
      <p class="checks-sum">${v.pending ? 'Before settling: ' : ''}${met} of 3 met${v.at ? ` · checked ${v.at}` : ''}</p>
      <ol class="checks">${rows.map(([name, key, [ok, ev]]) => `<li class="chk ${ok ? '' : 'check'}"><div class="c-top"><span class="c-stat ${ok ? 'ok' : 'check'}">${mk(ok ? 'mk-ok' : 'mk-check')}${ok ? 'Met' : 'Not met'}</span><span class="c-name">${name}<code>${key}</code></span></div><p class="c-ev cond-val">${ev}</p></li>`).join('')}</ol>
      <p class="trust">${icon('i-seal')}<span>Delivered kg and “every picking Verified” are stated by the Udgam server, the only account allowed to settle. The grade is signed by the server on behalf of the buyer’s account. The contract does the arithmetic.</span></p>
    </section>`;
  }
  const C = {
    released: { at: '30 Sep 2026, 4:12 pm', q: [1, '<b>612.0 kg</b> delivered · at least 600.0 kg agreed'], gr: [1, `Graded <b>${g(80)}</b> · minimum ${g(70)}`], ver: [1, '<b>14 of 14</b> pickings Verified · all must be Verified'] },
    ready:    { pending: 1, q: [1, '<b>612.0 kg</b> delivered · at least 600.0 kg agreed'], gr: [1, `Graded <b>${g(80)}</b> · minimum ${g(70)}`], ver: [1, '<b>14 of 14</b> pickings Verified · all must be Verified'] },
    notrel:   { at: '1 Oct 2026, 9:40 am', q: [0, '<b>598.5 kg</b> delivered · at least 600.0 kg agreed (1.5 kg short)'], gr: [1, `Graded <b>${g(80)}</b> · minimum ${g(70)}`], ver: [0, '<b>13 of 14</b> pickings Verified · all must be Verified. One picking (Farm F-0231, 24 Sep) still Needs a check.'] },
  };
  const outcomeReleased = (who) => `<div class="glass outcome ok-o" role="status"><p class="o-top">${chip('ok', 'Payment released')}</p>
      <p class="o-amount">₹1,50,000.00 <span class="mock">mock INR · not real money</span></p>
      <p>${who === 'buyer' ? 'Paid from escrow to Hosahalli FPO' : 'Paid from escrow to Hosahalli FPO'} on 30 Sep 2026, 4:12 pm. All three conditions were met.</p>
      <p class="o-meta">Ledger: Anvil (local test chain) · block 1,284 · tx <code>0x3f2a…9c1e</code></p></div>`;
  const outcomeNot = (who) => `<div class="glass outcome check-o" role="status"><p class="o-top">${chip('check', 'Not released')}</p>
      <p><b>2 conditions are not met:</b> delivered quantity (598.5 kg of 600.0 kg) and Verified pickings (13 of 14).</p>
      <p class="o-meta">${who === 'buyer' ? 'Your ₹1,50,000.00 (mock INR) stays in escrow.' : 'The ₹1,50,000.00 (mock INR) stays in escrow.'} A later delivery under this agreement can still settle it until 31 Dec 2026.</p></div>`;

  /* ════ Screens ═══════════════════════════════════════════════════════════════ */
  const BUYER_ROWS = cur => `<ul class="q-list" aria-label="Your agreements">
      ${row('#s=buyer-grade', 'i-seal', '', 'AG-0007 · Hosahalli FPO', '600.0 kg', 'Arabica · ₹1,50,000.00 · by 31 Dec', '', 'mk-check', 'Delivered · needs your grade', cur === 'AG-0007')}
      ${row('#s=buyer-agreements', 'i-seal', '', 'AG-0008 · Hosahalli FPO', '600.0 kg', 'Arabica · ₹1,50,000.00 · by 31 Dec', '', 'mk-check', 'Not released yet · 2 conditions not met', cur === 'AG-0008')}
      ${row('#s=buyer-fund&v=fund', 'i-seal', 'na', 'AG-0009 · Hosahalli FPO', '1,200.0 kg', 'Robusta · ₹2,40,000.00 · by 15 Feb', 'na', 'mk-na', 'Not funded yet', cur === 'AG-0009')}
      ${row('#s=buyer-agreements', 'i-seal', 'ok', 'AG-0004 · Hosahalli FPO', '500.0 kg', 'Arabica · ₹1,25,000.00 · 22 Sep', 'ok', 'mk-ok', 'Payment released', cur === 'AG-0004')}
      ${row('#s=buyer-fund&v=refund', 'i-seal', 'na', 'AG-0005 · Hosahalli FPO', '400.0 kg', 'Arabica · ₹1,00,000.00 · ended 30 Sep', 'na', 'mk-na', 'Deadline passed · you can take it back', cur === 'AG-0005')}
    </ul>`;
  const buyerList = (st, cur) => {
    const h = head('Buyer B-07 · Agreements', 'Agreements', st === 'data' || st === 'working' ? 'Money is held in escrow and paid to the FPO only when all three conditions are met. Amounts are mock INR.' : '', st === 'data' || st === 'working' ? 5 : null);
    const newBtn = `<a class="pill q-new" href="#s=buyer-new">${icon('i-arrow-right')}New agreement</a>`;
    if (st === 'loading') return h + listLoading('Loading your agreements…');
    if (st === 'empty') return h + emptyCard('No agreements yet.', 'Set one up with an FPO: what you need, the lowest grade you accept, and what you pay.', newBtn.replace('q-new', ''));
    if (st === 'error') return h + errorCard('Couldn’t load your agreements.', 'Nothing was changed.');
    return h + newBtn + BUYER_ROWS(cur);
  };

  const SCREENS = {
    /* 1 · Buyer: agreement list (detail = AG-0008, settlement result read-only) */
    'buyer-agreements': {
      label: 'Buyer · Agreement list', short: 'Agreements', shell: 'buyer', focus: 'list', states: ['data', 'loading', 'empty', 'error', 'working'],
      list: st => buyerList(st, 'AG-0008'),
      detail: st => {
        if (st === 'loading') return detailLoading;
        const a = AG['AG-0008'];
        return `<div class="d-body">${back('Back to agreements')}
          ${dHead('Agreement · Hosahalli FPO', 'AG-0008', chip('check', 'Not released yet'), `Created ${a.made} · batch ${a.batch} delivered ${a.dwhen}`)}
          ${st === 'working' ? `<p class="load-note" role="status">${icon('i-ring')}Hosahalli FPO is settling this agreement…</p>` : outcomeNot('buyer')}
          ${terms(a)}
          ${conditions(C.notrel)}
        </div>`;
      },
    },

    /* 2 · Buyer: new agreement */
    'buyer-new': {
      label: 'Buyer · New agreement', short: 'New agreement', shell: 'buyer', focus: 'detail', states: ['data', 'loading', 'empty', 'error', 'working'],
      list: st => buyerList(st === 'loading' ? 'loading' : 'data', null),
      detail: st => {
        if (st === 'loading') return detailLoading;
        const top = `${back('Back to agreements')}${dHead('Buyer B-07 · Agreements', 'New agreement', '', 'The FPO is paid from escrow only when all three conditions are met.')}`;
        if (st === 'empty') return `<div class="d-body">${top}${emptyCard('No FPO to agree with yet.', 'An agreement needs an FPO that has joined Udgam. Ask the FPO to get in touch.')}</div>`;
        const dis = st === 'working' ? ' disabled' : '';
        const opt = (v, sel) => `<option value="${v}"${sel ? ' selected' : ''}>${g(v)}</option>`;
        return `<div class="d-body">${top}
          <form class="glass card form-card" novalidate aria-labelledby="d-h" style="margin-top:16px">
            <div class="f-row">
              <div class="field"><label for="f-fpo">With</label><select id="f-fpo"${dis}><option>Hosahalli FPO</option></select></div>
              <div class="field"><label for="f-crop">Crop</label><select id="f-crop"${dis}><option selected>Arabica cherry</option><option>Robusta cherry</option></select></div>
            </div>
            <div class="f-row">
              <div class="field"><label for="f-kg">Agreed quantity (kg)</label><input id="f-kg" type="text" inputmode="decimal" value="600.0" aria-describedby="f-kg-h"${dis}><p class="hint" id="f-kg-h">Payment needs at least this much delivered.</p></div>
              <div class="field"><label for="f-min">Minimum grade</label><select id="f-min" aria-describedby="f-min-h"${dis}>${GRADES.map(([, v]) => opt(v, v === 70)).join('')}</select><p class="hint" id="f-min-h">You grade each delivered batch from 0 to 100.</p></div>
            </div>
            <div class="f-row">
              <div class="field"><label for="f-amt">Amount (mock INR)</label><input id="f-amt" type="text" inputmode="decimal" value="1,50,000.00" aria-describedby="f-amt-h"${dis}><p class="hint" id="f-amt-h">Mock INR for the demo. No real money moves.</p></div>
              <div class="field"><label for="f-by">Deadline</label><input id="f-by" type="date" value="2026-12-31" aria-describedby="f-by-h"${dis}><p class="hint" id="f-by-h">If nothing settles by then, you can take the money back.</p></div>
            </div>
            ${st === 'error' ? inlineErr('Couldn’t create the agreement.', 'Nothing was saved. What you typed is still here. Try again.') : ''}
            <p class="dec-note">${icon('i-seal')}<span>The server records this agreement on the ledger for your account. You fund it in the next step.</span></p>
            <button class="pill" type="button"${dis}>${st === 'working' ? `${spin}Creating the agreement…` : st === 'error' ? `${icon('i-retry')}Try again` : `${icon('i-check')}Create agreement`}</button>
          </form></div>`;
      },
    },

    /* 3 · Buyer: fund */
    'buyer-fund': {
      label: 'Buyer · Fund an agreement', short: 'Fund', shell: 'buyer', focus: 'detail', states: ['data', 'loading', 'empty', 'error', 'working'],
      variants: { fund: 'Fund', refund: 'Deadline passed: take it back' },
      list: (st, v) => buyerList(st === 'loading' ? 'loading' : 'data', v === 'refund' ? 'AG-0005' : 'AG-0009'),
      detail: (st, v) => {
        if (st === 'loading') return detailLoading;
        if (v === 'refund') {
          const r = AG['AG-0005'];
          return `<div class="d-body">${back('Back to agreements')}
          ${dHead('Agreement · Hosahalli FPO', 'AG-0005', chip('na', 'Deadline passed · not settled'), `Funded 2 Aug 2026 · ended ${r.by} · nothing was delivered under it`)}
          ${terms(r)}
          <form class="decide" style="margin-top:16px" aria-labelledby="rf-h" novalidate>
            <h3 id="rf-h">Take the money back</h3>
            <p>This agreement ended on ${r.by} without settling. ${r.amt} (mock INR) goes from escrow back to your balance, and the agreement closes.</p>
            <p class="dec-note">${icon('i-seal')}<span>Recorded on the ledger for your account.</span></p>
            <button class="pill" type="button">${icon('i-retry')}Take back ${r.amt}</button>
          </form></div>`;
        }
        if (st === 'empty') return `<div class="d-body">${back('Back to agreements')}${emptyCard('There’s no agreement AG-0009 for your account.', 'Check the number, or go back to your agreements.')}</div>`;
        const a = AG['AG-0009'];
        const dis = st === 'working' ? ' disabled' : '';
        return `<div class="d-body">${back('Back to agreements')}
          ${dHead('Agreement · Hosahalli FPO', 'AG-0009', chip('na', 'Not funded yet'), `Created ${a.made} · nothing is held until you fund it`)}
          ${terms(a)}
          <form class="decide" style="margin-top:16px" aria-labelledby="fund-h" novalidate>
            <h3 id="fund-h">Fund this agreement</h3>
            <p>₹2,40,000.00 (mock INR) moves from your balance into escrow. Hosahalli FPO is paid only when all three are true:</p>
            <ol><li>At least 1,200.0 kg is delivered.</li><li>Your grade for the batch is at least ${g(60)}.</li><li>Every picking in the batch is Verified.</li></ol>
            <p class="bal">Your mock INR balance: ₹5,00,000.00 → ₹2,60,000.00 after funding.</p>
            ${st === 'error' ? inlineErr('Couldn’t fund the agreement.', 'The ledger didn’t answer, so nothing moved. Your balance is unchanged.') : ''}
            <p class="dec-note">${icon('i-clock')}<span>If nothing settles by 15 Feb 2027, you can take the full amount back.</span></p>
            <button class="pill" type="button"${dis}>${st === 'working' ? `${spin}Moving ₹2,40,000.00 into escrow…` : st === 'error' ? `${icon('i-retry')}Try again` : `${icon('i-check')}Fund ₹2,40,000.00`}</button>
          </form></div>`;
      },
    },

    /* 4 · Buyer: grade a delivered batch */
    'buyer-grade': {
      label: 'Buyer · Grade a delivered batch', short: 'Grade', shell: 'buyer', focus: 'detail', states: ['data', 'loading', 'empty', 'error', 'working'],
      list: st => buyerList(st === 'loading' ? 'loading' : 'data', 'AG-0007'),
      detail: st => {
        if (st === 'loading') return detailLoading;
        const a = AG['AG-0007'];
        const top = `${back('Back to agreements')}${dHead('Agreement · Hosahalli FPO', 'AG-0007', st === 'empty' ? chip('na', 'Funded · waiting for delivery') : chip('check', 'Needs your grade'), `Funded 3 Sep 2026 · ₹1,50,000.00 (mock INR) held in escrow`)}`;
        if (st === 'empty') return `<div class="d-body">${top}${terms(a)}${emptyCard('No batch delivered yet.', 'When Hosahalli FPO delivers a batch under this agreement, you grade it here.')}</div>`;
        const dis = st === 'working' ? ' disabled' : '';
        return `<div class="d-body">${top}
          <section class="glass card terms" aria-labelledby="b-h"><h3 class="sec-h" id="b-h">Delivered batch</h3>
            <dl><div><dt>Batch</dt><dd>${a.batch} · <a href="verify.html">certificate</a></dd></div><div><dt>Delivered</dt><dd>${a.dkg} kg · ${a.dwhen}</dd></div>
            <div><dt>Pickings</dt><dd>14 of 14 Verified</dd></div><div><dt>Minimum grade</dt><dd>${g(a.min)}</dd></div></dl></section>
          <form class="decide" style="margin-top:16px" aria-labelledby="gr-h" novalidate>
            <h3 id="gr-h">Grade batch ${a.batch}</h3>
            <div class="field"><fieldset><legend>Quality grade</legend>
              <div class="opts">${GRADES.map(([w, v]) => `<label class="opt"><input type="radio" name="grade" value="${v}"${v === 80 ? ' checked' : ''}${dis}><span class="o-txt">${w}${v === a.min ? '<span>The agreed minimum</span>' : v < a.min ? '<span>Below the agreed minimum</span>' : ''}</span><span class="o-num">${v}</span></label>`).join('')}</div>
            </fieldset></div>
            <p class="hint">A grade below ${g(a.min)} means the payment is not released for this batch.</p>
            ${st === 'error' ? inlineErr('Couldn’t save the grade.', 'Nothing was signed. Your choice is still selected. Try again.') : ''}
            <p class="dec-note">${icon('i-seal')}<span>Signed by the server on behalf of your buyer account and recorded permanently. You can’t change it after signing.</span></p>
            <button class="pill" type="button"${dis}>${st === 'working' ? `${spin}Signing the grade…` : st === 'error' ? `${icon('i-retry')}Try again` : `${icon('i-check')}Sign: ${g(80)}`}</button>
          </form></div>`;
      },
    },

    /* 5 · FPO admin: agreement detail with the settlement panel */
    'admin-agreement': {
      label: 'FPO admin · Agreement and settlement', short: 'Settlement', shell: 'admin', focus: 'detail', states: ['data', 'loading', 'empty', 'error', 'working'],
      variants: { notrel: 'Not released (2 conditions)', ready: 'Ready to settle', released: 'Released' },
      list: (st, v) => {
        const h = head('Hosahalli FPO · Batches', 'Agreements with buyers', st === 'data' || st === 'working' ? 'Payments held for you in escrow. Each pays out when its three conditions are met.' : '', st === 'data' || st === 'working' ? 4 : null);
        if (st === 'loading') return h + listLoading('Loading agreements…');
        if (st === 'empty') return h + emptyCard('No agreements yet.', 'An agreement appears here when a buyer sets one up with your FPO.');
        if (st === 'error') return h + errorCard('Couldn’t load the agreements.', 'Nothing was changed.');
        const relNow = v === 'released';
        return h + `<ul class="q-list" aria-label="Agreements with buyers">
          ${row('#s=admin-agreement&v=' + (relNow ? 'released' : 'ready'), 'i-seal', relNow ? 'ok' : '', 'AG-0007 · Buyer B-07', '600.0 kg', 'Arabica · ₹1,50,000.00 · by 31 Dec', relNow ? 'ok' : '', relNow ? 'mk-ok' : 'mk-check', relNow ? 'Payment released' : 'Ready to settle', v !== 'notrel')}
          ${row('#s=admin-agreement&v=notrel', 'i-seal', '', 'AG-0008 · Buyer B-07', '600.0 kg', 'Arabica · ₹1,50,000.00 · by 31 Dec', '', 'mk-check', 'Not released · 2 conditions not met', v === 'notrel')}
          ${row('#s=admin-agreement', 'i-seal', 'na', 'AG-0009 · Buyer B-07', '1,200.0 kg', 'Robusta · ₹2,40,000.00 · by 15 Feb', 'na', 'mk-na', 'Buyer hasn’t funded it yet')}
          ${row('#s=admin-agreement', 'i-seal', 'ok', 'AG-0004 · Buyer B-07', '500.0 kg', 'Arabica · ₹1,25,000.00 · 22 Sep', 'ok', 'mk-ok', 'Payment released')}
        </ul>`;
      },
      detail: (st, v) => {
        if (st === 'loading' || st === 'empty' || st === 'error') return detailLoading;
        const id = v === 'notrel' ? 'AG-0008' : 'AG-0007', a = AG[id];
        const chipH = v === 'released' ? chip('ok', 'Payment released') : v === 'notrel' ? chip('check', 'Not released') : chip('na', 'Funded · ready to settle');
        const top = `${back('Back to agreements')}${dHead('Agreement · Buyer B-07', id, chipH, `Funded ${v === 'notrel' ? '5 Sep' : '3 Sep'} 2026 · batch ${a.batch} delivered ${a.dwhen} · deadline ${a.by}`)}`;
        if (st === 'working') return `<div class="d-body">${top}
            <p class="load-note" role="status">${icon('i-ring')}Settling: sending the three conditions to the ledger…</p>${conditions(C.ready)}${terms(a)}</div>
          <div class="d-actions"><button class="pill" type="button" disabled>${spin}Settling…</button></div>`;
        if (v === 'released') return `<div class="d-body">${top}${outcomeReleased('admin')}${conditions(C.released)}${terms(a)}</div>`;
        if (v === 'notrel') return `<div class="d-body">${top}${outcomeNot('admin')}${conditions(C.notrel)}${terms(a)}</div>
          <div class="d-actions"><a class="pill ghost" href="admin.html">${icon('i-inbox')}Open the picking that needs a check</a></div>`;
        return `<div class="d-body">${top}${conditions(C.ready)}${terms(a)}</div>
          <div class="d-actions"><button class="pill" type="button">${icon('i-check')}Settle: pay ₹1,50,000.00 to Hosahalli FPO</button><p class="again-hint" style="text-align:left">The ledger checks all three conditions again before it pays.</p></div>`;
      },
    },

    /* 6 · Processor: record a processing step and hand on */
    'processor': {
      label: 'Processor · Record a step, hand on', short: 'Processor', shell: 'processor', focus: 'detail', states: ['data', 'loading', 'empty', 'error', 'working'],
      variants: { form: 'Record a step', within: 'Recorded · within range', flagged: 'Recorded · flagged', handed: 'Handed on' },
      list: (st, v) => {
        const h = head('Curing works C-03', 'Batches with you', st === 'data' || st === 'working' ? 'Record what you did to each batch, then hand it on to the buyer.' : '', st === 'data' || st === 'working' ? (v === 'handed' ? 1 : 2) : null);
        if (st === 'loading') return h + listLoading('Loading your batches…');
        if (st === 'empty') return h + emptyCard('No batches with you right now.', 'A batch appears here when an FPO hands it to you.');
        if (st === 'error') return h + errorCard('Couldn’t load your batches.', 'Nothing was changed.');
        const why = { form: ['na', 'mk-na', 'Ready for a processing step'], within: ['ok', 'mk-ok', 'Hulled · within the expected range'], flagged: ['', 'mk-check', 'Hulled · flagged: 70.0% of input'], handed: ['ok', 'mk-ok', 'Handed on to Buyer B-07'] }[v];
        return h + `<ul class="q-list" aria-label="Batches with you">
          ${row('#s=processor&v=' + v, 'i-box', why[0] || '', 'KDG-2026-0151 · Arabica', '600.0 kg', 'From Hosahalli FPO · 30 Sep', why[0], why[1], why[2], true)}
          ${v === 'handed' ? '' : row('#s=processor&v=form', 'i-box', 'na', 'KDG-2026-0160 · Robusta', '880.0 kg', 'From Hosahalli FPO · 2 Oct', 'na', 'mk-na', 'Ready for a processing step')}
        </ul>`;
      },
      detail: (st, v) => {
        if (st === 'loading' || st === 'empty' || st === 'error') return detailLoading;
        const chipH = { form: chip('na', 'With you'), within: chip('ok', 'Within range'), flagged: chip('check', 'Flagged'), handed: chip('ok', 'Handed on') }[v];
        const top = `${back('Back to batches')}${dHead('Batch · from Hosahalli FPO', 'KDG-2026-0151', chipH, 'Arabica · 14 pickings · received 30 Sep 2026, signed on behalf of Hosahalli FPO')}`;
        const dis = st === 'working' ? ' disabled' : '';
        if (v === 'form' || st === 'working') {
          const procs = [['Pulping', 'Fresh cherry to wet parchment · placeholder range, to be confirmed'], ['Drying', 'Placeholder range, to be confirmed'], ['Hulling parchment', 'Expected output 75–85% of input (Arabica)'], ['Hulling dry cherry', 'Expected output 48.5–58.5% of input (Arabica)']];
          return `<div class="d-body">${top}
            <form class="glass card form-card" style="margin-top:16px" aria-labelledby="p-h" novalidate>
              <h3 class="sec-h" id="p-h">Record a processing step</h3>
              <div class="field"><fieldset><legend>Process</legend><div class="opts">${procs.map(([w, s]) => `<label class="opt"><input type="radio" name="proc"${w === 'Hulling parchment' ? ' checked' : ''}${dis}><span class="o-txt">${w}<span>${s}</span></span></label>`).join('')}</div></fieldset></div>
              <div class="f-row">
                <div class="field"><label for="p-in">Input (kg)</label><input id="p-in" type="text" inputmode="decimal" value="600.0" aria-describedby="p-in-h"${dis}><p class="hint" id="p-in-h">What you weighed going in.</p></div>
                <div class="field"><label for="p-out">Output (kg)</label><input id="p-out" type="text" inputmode="decimal" value="${st === 'working' ? '480.0' : ''}" aria-describedby="p-out-h"${dis}><p class="hint" id="p-out-h">What you weighed coming out.</p></div>
              </div>
              <p class="band-line">${icon('i-trend')}<span>For hulling parchment (Arabica), output is usually 75–85% of input. Outside that range the step is flagged, not refused.</span></p>
              <p class="dec-note">${icon('i-seal')}<span>Signed by the server on behalf of your account and recorded permanently.</span></p>
              <button class="pill" type="button"${dis}>${st === 'working' ? `${spin}Recording the step…` : `${icon('i-check')}Sign and record step`}</button>
            </form></div>`;
        }
        const flagged = v === 'flagged';
        const result = `<section class="glass card checks-card" aria-labelledby="mb-h"><h3 class="sec-h" id="mb-h">Hulling parchment · recorded 1 Oct 2026, 10:05 am</h3>
          <p class="checks-sum">Input 600.0 kg · output ${flagged ? '420.0' : '480.0'} kg</p>
          <ol class="checks"><li class="chk ${flagged ? 'check' : ''}"><div class="c-top"><span class="c-stat ${flagged ? 'check' : 'ok'}">${mk(flagged ? 'mk-check' : 'mk-ok')}${flagged ? 'Flagged' : 'Within range'}</span><span class="c-name">Weight in and out<code>mass_balance · mb-1</code></span></div>
          <p class="c-ev">Output ${flagged ? '420.0' : '480.0'} kg is ${flagged ? '70.0' : '80.0'}% of input 600.0 kg (expected 75–85% for hulling parchment).${flagged ? '<span class="again">Nothing is refused. The step is recorded, and the flag shows on the batch’s certificate.</span>' : ''}</p></li></ol></section>`;
        if (v === 'handed') return `<div class="d-body">${top}${result}
          <div class="glass outcome handed" style="margin-top:16px" role="status"><p class="o-top">${chip('ok', 'Handed on to Buyer B-07')}<b>Recorded</b></p><p class="o-meta">Signed on behalf of Ravi P. (Curing works C-03) on 1 Oct 2026, 10:20 am. This batch is no longer with you.</p></div></div>`;
        return `<div class="d-body">${top}${result}
          <form class="decide" style="margin-top:16px" aria-labelledby="h-h" novalidate>
            <h3 id="h-h">Hand on to a buyer</h3>
            <div class="field"><label for="h-to">Buyer</label><select id="h-to"><option>Buyer B-07</option></select></div>
            <p class="dec-note">${icon('i-seal')}<span>Signed by the server on behalf of your account. After this, the batch is no longer with you.</span></p>
            <button class="pill" type="button">${icon('i-arrow-right')}Sign and hand on</button>
          </form></div>`;
      },
    },

    /* 7 · Certificate: the extra journey step (existing journey component, content only) */
    'certificate': {
      label: 'Certificate · Processing step in the journey', short: 'Certificate', shell: null, focus: 'cert', states: ['data', 'loading', 'empty', 'error'],
      variants: { ok: 'Step within range', flagged: 'Step flagged' },
      cert: (st, v) => {
        const flagged = v === 'flagged';
        const step = (t, when, where, extra = '', dot = `<span class="t-dot">${icon('i-check')}</span>`) => `<li>${dot}<div><p class="t-step">${t}</p><p class="t-when">${when}</p><p class="t-where">${where}</p>${extra}</div></li>`;
        const proc = flagged
          ? step('Hulled', '1 Oct 2026', 'At Processor C-03 · 600.0 kg in, 420.0 kg out (70.0%)', `<p class="t-flag">${mk('mk-check')}<span>Flagged: 75–85% is expected for hulling parchment</span></p>`, `<span class="t-dot flag">${mk('mk-check')}</span>`)
          : step('Hulled', '1 Oct 2026', 'At Processor C-03 · 600.0 kg in, 480.0 kg out (80.0%)');
        const steps = [
          step('Harvested', '2–27 Sep 2026', '3 farms in Kodagu'),
          step('Checked', '14 pickings', 'Each at its plot, on the day it was picked'),
          step('Batched', '28 Sep 2026', 'Hosahalli FPO'),
          ...(st === 'empty' ? [] : [proc]),
          step('Handed to buyer', st === 'empty' ? '29 Sep 2026' : '1 Oct 2026', 'Buyer B-07'),
        ];
        const proof = st === 'loading' ? `<p class="cert-proof" role="status">${icon('i-ring', 'ic spin')}Checking 7 of 16 records…</p>`
          : st === 'error' ? `<p class="cert-proof">${mk('mk-bad')}Does not match: record 15 of 16</p>`
          : `<p class="cert-proof">${mk('mk-ok')}Verified on this device just now · ${st === 'empty' ? 15 : 16} records</p>`;
        const body = st === 'loading'
          ? `<ol class="tl-sk" aria-hidden="true">${[0, 1, 2, 3, 4].map(() => `<li><span class="sk"></span><span class="sk-stack"><span class="sk sk-line" style="width:40%"></span><span class="sk sk-line" style="width:65%"></span></span></li>`).join('')}</ol>`
          : `<ol class="tl">${steps.join('')}</ol>`;
        return `<header class="site"><span class="wordmark"><img src="cherry.svg" alt="" width="38" height="38">Udgam</span><span class="kind">${icon('i-seal')}Certificate</span></header>
          <h1 id="c-h">Kodagu Arabica</h1><p class="d-meta">Batch KDG-2026-0151 · 600.0 kg</p>
          ${proof}
          ${st === 'error' ? '<p class="unconfirmed"><b>The details below are what the seller published.</b> Until the check passes, they are not confirmed.</p>' : ''}
          <section class="block" aria-labelledby="tl-h"><h2 id="tl-h">How it got here</h2><div class="glass journey">${body}</div>
          <p class="cert-note">${st === 'empty' ? 'This batch had no processing step, so the journey is the same as before M-002.' : 'Only the “Hulled” step is new. The rest of the certificate is unchanged (verify.html).'}</p></section>`;
      },
    },
  };

  /* ════ Routing ═══════════════════════════════════════════════════════════════ */
  const STATE_LABEL = { data: 'Data', loading: 'Loading', empty: 'Empty', error: 'Error', working: 'Working' };
  let cur = { s: 'buyer-agreements', st: 'data', v: null };
  function parse() {
    const p = new URLSearchParams(location.hash.slice(1));
    const s = SCREENS[p.get('s')] ? p.get('s') : 'buyer-agreements', S = SCREENS[s];
    const st = S.states.includes(p.get('st')) ? p.get('st') : 'data';
    const vs = S.variants ? Object.keys(S.variants) : [null];
    const v = vs.includes(p.get('v')) ? p.get('v') : vs[0];
    return { s, st, v };
  }
  const href = (s, st, v) => '#' + new URLSearchParams(Object.entries({ s, st, v }).filter(([, x]) => x && x !== 'data')).toString();
  function render() {
    cur = parse();
    const S = SCREENS[cur.s], b = document.body;
    b.dataset.screen = cur.s;
    $('#bn-where').textContent = `${S.short} · ${STATE_LABEL[cur.st]}`;
    if (S.shell) {
      const rail = $('#rail');
      rail.innerHTML = railHTML(S.shell); rail.dataset.n = RAILS[S.shell].n;
      rail.setAttribute('aria-label', { buyer: 'Buyer sections', admin: 'Admin sections', processor: 'Processor sections' }[S.shell]);
      b.dataset.rail = RAILS[S.shell].n;
      // list-level states (list-focused screens, and empty/error where the list itself is empty) use admin.html's single-column rule
      const listLevel = S.focus === 'list' ? cur.st : (['admin-agreement', 'processor'].includes(cur.s) && ['empty', 'error'].includes(cur.st)) ? cur.st : (cur.st === 'loading' ? 'loading' : 'working');
      b.dataset.state = listLevel === 'data' ? 'working' : listLevel;
      $('#queue').innerHTML = S.list(cur.st, cur.v);
      $('#detail').innerHTML = S.detail(cur.st, cur.v);
      let listPref = false; try { listPref = !!sessionStorage.getItem('m2-list'); } catch (e) {}
      const open = S.focus === 'detail' && !['empty', 'error', 'loading'].includes(b.dataset.state) && !listPref && !wideMQ.matches;
      b.classList.toggle('detail-open', open);
      // < 1100 px with the detail as the whole screen, the list (and its h1) is hidden: repeat the list's h1, visually hidden, above the detail
      if (open) { const h1 = document.createElement('h1'); h1.className = 'vh'; h1.textContent = $('#q-h').textContent.trim(); $('#detail').prepend(h1); }
      $('#cert').innerHTML = '';
      const d = $('#detail');
      if ($('#d-h')) { d.setAttribute('aria-labelledby', 'd-h'); d.removeAttribute('aria-label'); } else { d.removeAttribute('aria-labelledby'); d.setAttribute('aria-label', 'Details'); }
    } else {
      b.dataset.state = 'working'; b.classList.remove('detail-open'); delete b.dataset.rail;
      $('#queue').innerHTML = ''; $('#detail').innerHTML = ''; $('#rail').innerHTML = '';
      const c = $('#cert'); c.dataset.cert = cur.st === 'error' ? 'mismatch' : cur.st; c.innerHTML = S.cert(cur.st, cur.v);
    }
    // reviewer menu
    $('#screen-menu').innerHTML = Object.entries(SCREENS).flatMap(([k, X]) => (X.variants ? Object.entries(X.variants) : [[null, null]]).map(([vk, vl]) =>
      `<a href="${href(k, cur.st !== 'data' && X.states.includes(cur.st) ? cur.st : null, vk)}" aria-current="${k === cur.s && vk === cur.v}">${X.label}${vl ? `<small>${vl}</small>` : ''}</a>`)).join('');
    $('#state-menu').innerHTML = S.states.map(st => `<a href="${href(cur.s, st, cur.v)}" aria-current="${st === cur.st}">${STATE_LABEL[st]}</a>`).join('');
    window.scrollTo(0, 0);
  }
  wideMQ.addEventListener('change', () => render());
  addEventListener('hashchange', () => { try { sessionStorage.removeItem('m2-list'); } catch (e) {} render(); });
  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) { e.preventDefault(); $('#live').textContent = `${nav.textContent.trim()} is not part of this prototype.`; return; }
    if (e.target.closest('[data-back]')) { try { sessionStorage.setItem('m2-list', '1'); } catch (e2) {} document.body.classList.remove('detail-open'); window.scrollTo(0, 0); const h = $('#q-h'); if (h) h.focus({ preventScroll: true }); return; }
    if (e.target.closest('[data-retry]')) { location.hash = href(cur.s, 'loading', cur.v); return; }
  });
  const sd = $('#states-dialog');
  $('#states-btn').addEventListener('click', () => sd.showModal());
  sd.addEventListener('click', e => { if (e.target === sd || e.target.closest('[data-close]') || e.target.closest('#screen-menu a, #state-menu a')) sd.close(); });
  render();
})();
</script>
</body>
</html>
