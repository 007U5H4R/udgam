name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      # Pinned release; the SHA-256 is from gitleaks_8.30.0_checksums.txt in the same release.
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # Scans every commit reachable from the checkout, on every event (extends the default rules).
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml --exit-code 1 .'

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm audit --prod --audit-level=high

  dataset:
    name: dataset (eval:validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TC-017: ajv (JSON Schema 2020-12) plus unique IDs and case references; fails naming the path.
      - run: pnpm eval:validate

  setup-idempotent:
    name: setup-idempotent (TC-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: First run
        run: bash scripts/cloud-setup.sh
      - name: Second run (each step must report ok)
        shell: bash
        run: |
          bash scripts/cloud-setup.sh | tee "$RUNNER_TEMP/second-run.log"
          if grep -q '^did:' "$RUNNER_TEMP/second-run.log"; then
            echo "::error::the second run changed something"
            exit 1
          fi
      - run: git diff --exit-code
      - name: Working tree is clean
        run: test -z "$(git status --porcelain)"
      - run: pnpm typecheck
      - run: pnpm test
