name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    env:
      # Pinned release; the SHA-256 is from gitleaks_8.30.0_checksums.txt in the same release.
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # Scans every commit reachable from the checkout, on every event (extends the default rules).
      - name: Scan full history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --config .gitleaks.toml --exit-code 1 .'

  audit:
    # TC-075, EVAL-085 (TSK-19.7): a known high or critical advisory in a production dependency fails
    # the build. Make this job a required status check on main (repository settings).
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No `cache: pnpm` here: this job never installs, so the pnpm store path does not exist and
      # setup-node's post-job cache save fails the job ("Path Validation Error").
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level=high

  bundle-secrets:
    # TC-075, EVAL-083 (TSK-19.7): build with CI-only fake secret values, then fail if any of them is in
    # what the browser downloads. The script names the variable, never the value.
    name: bundle-secrets (no server secret in the client bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with the fake environment
        shell: bash
        run: |
          set -a
          . ./.env.ci.example
          set +a
          pnpm build
      - run: bash scripts/ci/check-bundle-secrets.sh .env.ci.example .next
      # Final branch review finding 1: no data, key or env file in any server file trace (.nft.json),
      # which `output: 'standalone'` would copy into the artifact.
      - run: node scripts/ci/check-trace.mjs .next

  dataset:
    name: dataset (eval:validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TC-017: ajv (JSON Schema 2020-12) plus unique IDs and case references; fails naming the path.
      - run: pnpm eval:validate

  setup-idempotent:
    name: setup-idempotent (TC-002)
    runs-on: ubuntu-latest
    env:
      CLOUD_SETUP_STRICT: '1' # a failed Foundry/solc download fails the first run, not the second
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: First run
        run: bash scripts/cloud-setup.sh
      - name: Second run (each step must report ok)
        shell: bash
        run: |
          bash scripts/cloud-setup.sh | tee "$RUNNER_TEMP/second-run.log"
          if grep -q '^did:' "$RUNNER_TEMP/second-run.log"; then
            echo "::error::the second run changed something"
            exit 1
          fi
      - run: git diff --exit-code
      - name: Working tree is clean
        run: test -z "$(git status --porcelain)"
      - run: pnpm typecheck
      - run: pnpm test
