name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reads .gitleaks.toml at the repo root (extends the default rules).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only organisation accounts need a licence: set the GITLEAKS_LICENSE repository secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm audit --prod --audit-level=high

  dataset:
    name: dataset (eval:validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A stub that exits 0 with a ::warning:: until TKT-03 replaces it with real dataset validation.
      - run: pnpm eval:validate

  setup-idempotent:
    name: setup-idempotent (TC-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: First run
        run: bash scripts/cloud-setup.sh
      - name: Second run (each step must report ok)
        run: |
          bash scripts/cloud-setup.sh | tee "$RUNNER_TEMP/second-run.log"
          if grep -q '^did:' "$RUNNER_TEMP/second-run.log"; then
            echo "::error::the second run changed something"
            exit 1
          fi
      - run: git diff --exit-code
      - name: Working tree is clean
        run: test -z "$(git status --porcelain)"
      - run: pnpm typecheck
      - run: pnpm test
