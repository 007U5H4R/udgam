<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The only fontconfig configuration the link-preview render sees (scripts/og/render.ts sets FONTCONFIG_FILE to
  this file for the Chromium it launches). Linux Chromium asks fontconfig how to rasterise each font, even a
  web font: hinting, antialiasing, subpixel (LCD) order. The host's /etc/fonts and ~/.config/fontconfig answer
  differently on every machine (this VM: hintslight + RGB subpixel; a GitHub runner: Ubuntu's defaults), so the
  same page drew different glyph edges. Here every answer is fixed: grayscale antialiasing, no hinting, no LCD
  order, no autohinter, no embedded bitmaps. The host's configuration files are not read.

  The font directories are for fallback only: the artwork draws nothing but the inlined Figtree, but Chromium
  needs fontconfig to know some installed fonts before a web font loads.
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
