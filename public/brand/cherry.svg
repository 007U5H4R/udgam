<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Udgam brand object: a cluster of three glossy red coffee cherries on a short branch with two leaves, glowing softly">
  <!-- Udgam brand object v2 · coffee cherry cluster · DESIGN PROTOTYPE, Stage 4 final (Opal-inspired, Direction D).
       v1 (single round cherry) read as a plum/apple at large sizes; v2 shows three small oval cherries clustered at a
       branch node, as coffee actually grows. Per-cherry lighting uses objectBoundingBox gradients so each berry is lit
       from the top-left. Reused by index.html, verify.html, admin.html and the link-preview image. -->
  <defs>
    <radialGradient id="cc-halo" cx="200" cy="215" r="195" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5FD6A2" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#3A9C74" stop-opacity=".14"/>
      <stop offset="1" stop-color="#1B4A38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cc-pool" cx="200" cy="366" r="140" gradientTransform="translate(0 366) scale(1 .18) translate(0 -366)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9F5D2" stop-opacity=".6"/>
      <stop offset=".35" stop-color="#7FE3C1" stop-opacity=".32"/>
      <stop offset=".7" stop-color="#AA96FF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#AA96FF" stop-opacity="0"/>
    </radialGradient>
    <!-- berry body, lit from top-left (per berry) -->
    <radialGradient id="cc-body" cx=".38" cy=".3" r=".78" fx=".3" fy=".22">
      <stop offset="0" stop-color="#FF8A70"/>
      <stop offset=".12" stop-color="#EA4A3B"/>
      <stop offset=".38" stop-color="#C8322B"/>
      <stop offset=".64" stop-color="#861621"/>
      <stop offset=".86" stop-color="#430811"/>
      <stop offset="1" stop-color="#23050B"/>
    </radialGradient>
    <!-- warm subsurface bounce at the bottom of each berry -->
    <radialGradient id="cc-bounce" cx=".6" cy=".92" r=".55">
      <stop offset="0" stop-color="#FF6A4D" stop-opacity=".5"/>
      <stop offset="1" stop-color="#E0402F" stop-opacity="0"/>
    </radialGradient>
    <!-- iridescent fresnel rim -->
    <radialGradient id="cc-rim" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#7FE3C1" stop-opacity="0"/>
      <stop offset=".93" stop-color="#9FF0D0" stop-opacity=".35"/>
      <stop offset="1" stop-color="#B7A6FF" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="cc-spec" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc-branch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B2A1E"/>
      <stop offset=".5" stop-color="#6B4A30"/>
      <stop offset="1" stop-color="#3B2A1E"/>
    </linearGradient>
    <linearGradient id="cc-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FD6A2"/>
      <stop offset=".45" stop-color="#2E8A62"/>
      <stop offset="1" stop-color="#0F4A33"/>
    </linearGradient>
    <linearGradient id="cc-leaf-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6FFF2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E6FFF2" stop-opacity=".35"/>
      <stop offset="1" stop-color="#E6FFF2" stop-opacity="0"/>
    </linearGradient>
    <filter id="cc-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="cc-blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <!-- one berry, drawn at the origin; placed with <use> -->
    <g id="cc-berry">
      <ellipse cx="0" cy="0" rx="46" ry="56" fill="url(#cc-body)"/>
      <ellipse cx="0" cy="0" rx="46" ry="56" fill="url(#cc-bounce)"/>
      <ellipse cx="0" cy="0" rx="46" ry="56" fill="url(#cc-rim)"/>
      <ellipse cx="-16" cy="-24" rx="13" ry="9" transform="rotate(-28 -16 -24)" fill="url(#cc-spec)"/>
      <ellipse cx="-24" cy="-6" rx="4" ry="9" transform="rotate(-10 -24 -6)" fill="#fff" opacity=".22" filter="url(#cc-blur2)"/>
      <!-- flower scar (the crown at the tip of a coffee cherry) -->
      <circle cx="4" cy="46" r="6" fill="#3A0810" opacity=".85"/>
      <circle cx="4" cy="46" r="3.2" fill="#6E1A22"/>
    </g>
  </defs>

  <!-- halo + light pool -->
  <circle cx="200" cy="215" r="195" fill="url(#cc-halo)"/>
  <ellipse cx="200" cy="366" rx="140" ry="26" fill="url(#cc-pool)"/>

  <!-- branch -->
  <path d="M70 118 C140 132 220 126 336 96" stroke="url(#cc-branch)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M74 115 C140 128 220 122 332 93" stroke="#8A6444" stroke-width="2" stroke-linecap="round" fill="none" opacity=".55"/>

  <!-- leaves: long, glossy, wavy-edged coffee leaves -->
  <g>
    <path d="M300 104 C318 70 356 52 392 52 C372 78 346 104 300 104 Z" fill="url(#cc-leaf)"/>
    <path d="M302 102 C330 86 358 70 386 56" stroke="#0B3A28" stroke-width="2" fill="none" opacity=".7"/>
    <path d="M300 104 C318 70 356 52 392 52" stroke="url(#cc-leaf-sheen)" stroke-width="5" fill="none"/>
  </g>
  <g>
    <path d="M96 122 C72 94 34 84 6 92 C26 116 62 132 96 122 Z" fill="url(#cc-leaf)"/>
    <path d="M94 121 C70 108 40 98 12 93" stroke="#0B3A28" stroke-width="2" fill="none" opacity=".7"/>
  </g>

  <!-- short stalks from the node -->
  <path d="M188 128 C180 150 168 164 154 176" stroke="#4A3524" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M206 127 C210 150 218 166 232 178" stroke="#4A3524" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M197 128 C198 160 196 190 196 206" stroke="#4A3524" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- soft shadow under the cluster -->
  <ellipse cx="200" cy="330" rx="110" ry="22" fill="#000" opacity=".45" filter="url(#cc-soft)"/>

  <!-- three berries: two behind, one front-centre -->
  <use href="#cc-berry" transform="translate(146 220) rotate(14) scale(.92)"/>
  <use href="#cc-berry" transform="translate(254 222) rotate(-12) scale(.92)"/>
  <use href="#cc-berry" transform="translate(200 262) rotate(4)"/>
</svg>
