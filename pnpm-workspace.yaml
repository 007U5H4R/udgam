# pnpm 12 blocks dependency build scripts by default. None are needed:
# esbuild, sharp and unrs-resolver ship prebuilt binaries as optional packages.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

# GHSA-68fv-2mgg-jv7q (high): source-map-js < 1.2.2 (via next and vite → postcss). Remove once
# postcss depends on a patched version.
overrides:
  source-map-js: 1.2.2
